{% extends "base.html" %}
{% block title %}Log in · Photo Release Checker{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Log in</h1>
  <div class="card">
    <form action="{{ url_for('auth.login') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit" style="margin-top:16px; width:100%">Log in</button>
    </form>
  </div>
  <p class="hint" style="text-align:center">No account? <a href="{{ url_for('auth.register') }}">Register</a>.</p>
</div>
{% endblock %}
