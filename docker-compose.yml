services:
  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      # Required in production. For local trial these have dev fallbacks, but set
      # them so the audit ledger stays verifiable across restarts.
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-change-me}
      - AUDIT_KEY=${AUDIT_KEY:-dev-only-audit-key-change-me}
    volumes:
      # Persist the SQLite app DB and the tamper-evident audit ledger.
      - app-instance:/usr/src/app/instance

volumes:
  app-instance:
